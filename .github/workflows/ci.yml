name: CI

on:
  push:
    branches: [main]
  pull_request:
  # figma-token-sync.yml starts a run on a zen/tokens/figma-sync-* branch once it has committed the generated sources.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates, tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The Ubuntu mirror sometimes stalls a download, and apt waits 120 s each time before it retries: on 2026-10-26 the
      # Chromium dependencies took 17 min (run 40397158706) and the audit job ran out of time. Short waits, more retries.
      - name: apt retries a stalled download sooner
        run: printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "5";\n' | sudo tee /etc/apt/apt.conf.d/99zen-ci
      - name: Playwright Chromium (browser tests, audits, figma contract)
        run: npx playwright install --with-deps chromium

      - name: Generated sources are committed and up to date
        run: |
          npm run tokens:build && npm run styles:build && npm run icons:build
          git diff --exit-code -- src/styles src/tokens src/icons platforms
      - run: npm run tokens:check
      - run: npm run styles:check
      - run: npm run icons:check
      - name: Types
        run: npx tsc --noEmit -p .
      - name: Usage harness (rules, fixtures, app mode, ESLint plugin)
        run: npm run usage:selftest && npm run usage:check
      - name: Guidelines and props docs are up to date
        run: npm run guidelines:check
      - name: Example snippets are portable and compile as copied
        run: npm run examples:check
      - name: Vue port matches React (web core, DOM and API parity, vue-tsc)
        run: npm run vue:check
      - name: MCP server
        run: npm run mcp:selftest
      - name: AI UI catalog is up to date and the runtime self-test passes
        run: npm run ai-ui:check && npm run ai-ui:selftest
      - name: Platform-audit self-test (the in-page quality, outline and clip checks on fixtures)
        run: npm run platform:audit:selftest
      - name: Browser tests (smoke + axe baseline, sizes, interactions)
        run: npm test
      - name: Figma parity
        run: node tools/figma-contract/run-all.mjs
      - name: Build (library + platform)
        run: npm run build
      - name: Package (pack, install in a temp app, budgets, zen-usage, MCP, zen-ds)
        run: npm run verify:package
      - name: Vue package (build, pack, install in a temp Vue app, vue-tsc, budgets, SSR)
        run: npm run vue:verify-package -- --reuse-lib

  # Light and dark run as two jobs side by side, each with its own dev server. One after the other they took 32–37 min on
  # main (2026-11-24/26: light 16–21, dark 16–17, setup 2), and pages that did not answer in 180 s (each costs 3 min, then
  # passes in a new browser) cancelled #427 at 45 min twice. 35 leaves each job room for about four more of those.
  platform-audit:
    name: Platform audit (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: light
            flags: ""
          - mode: dark
            flags: "-- --dark"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The Ubuntu mirror sometimes stalls a download, and apt waits 120 s each time before it retries: on 2026-10-26 the
      # Chromium dependencies took 17 min (run 40397158706) and the audit job ran out of time. Short waits, more retries.
      - name: apt retries a stalled download sooner
        run: printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "5";\n' | sudo tee /etc/apt/apt.conf.d/99zen-ci
      - run: npx playwright install --with-deps chromium
      - name: Dev server
        run: |
          npx vite --port 5173 --strictPort > vite.log 2>&1 &
          npx --yes wait-on@8 --timeout 120000 http://localhost:5173
      - name: DOM, a11y, overflow, contrast and edge checks (${{ matrix.mode }})
        run: npm run platform:audit ${{ matrix.flags }}
      # A page that does not answer is reported with the step it was in and whether the dev server still answered; the
      # server's own log tells the rest.
      - name: Dev server log
        if: failure() || cancelled()
        run: tail -n 80 vite.log
