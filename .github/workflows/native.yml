name: Native packages

# The SwiftUI and Flutter token packages (platforms/, generated by scripts/build-native-tokens.mjs) compiled and tested
# on macOS: `swift test` and `flutter test` (user 2026-10-24; BACKLOG "Native packages never compiled"). ci.yml already
# checks the generated files are up to date; this runs them. Only when they or their generator change, or by hand, so
# macOS minutes stay low.
on:
  pull_request:
    paths:
      - "platforms/**"
      - "scripts/build-native-tokens.mjs"
      - ".github/workflows/native.yml"
  push:
    branches: [main]
    paths:
      - "platforms/**"
      - "scripts/build-native-tokens.mjs"
      - ".github/workflows/native.yml"
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: SwiftUI tokens (swift test)
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: swift test
        working-directory: platforms/swift
        run: swift test

  flutter:
    name: Flutter tokens (flutter test)
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true
      - name: Toolchain
        run: flutter --version
      - name: flutter test
        working-directory: platforms/flutter
        run: flutter test
